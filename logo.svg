  <path d="M44 84H84L64 64L44 84Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Falling Sand -->
  <line x1="64" y1="64" x2="64" y2="74" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <!-- Glitch Accent (Optional) -->
  <rect x="88" y="10" width="12" height="12" fill="black" transform="rotate(15 94 16)"/>
