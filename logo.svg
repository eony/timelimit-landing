<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hard Shadow -->
  <rect x="24" y="24" width="96" height="96" rx="16" fill="black"/>
  <!-- Main Box -->
  <rect x="16" y="16" width="96" height="96" rx="16" fill="#00d4ff" stroke="black" stroke-width="6"/>
  <!-- Hourglass Icon -->
  <!-- Top Triangle (Filled Black) -->
  <path d="M44 44H84L64 64L44 44Z" fill="black" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bottom Triangle (Outlined Black, White flll for 'empty' look, or Black for solid) -->
